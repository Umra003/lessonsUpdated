<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
  .apply-button {
    background-color: rgb(10, 102, 194);
    color: white;
    border: none;
    height: 40px;
    width: 240px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 20px;
    cursor: pointer;
    margin-right: 8px;
  }

  .save-button {
    background-color: white;
    color: rgb(28, 69, 111);
    border-width: 1px;
    border-style: solid;
    border-color: rgb(42, 96, 151);
    height: 50px;
    width: 70px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 20px;
    cursor: pointer;
  }
</style>

<button class="apply-button">
  Apply on company website
</button>

<button class="save-button">
  Save
</button>
</body>
</html>
