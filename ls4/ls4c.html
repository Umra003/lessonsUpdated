<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
  .github-button {
    background-color: rgb(24, 117, 50);
    color: white;
    border: none;
    padding-top: 14px;
    padding-bottom: 14px;
    padding-left: 18px;
    padding-right: 18px;
    font-weight: bold;
    font-size: 18px;
    border-radius: 7px;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }

  .github-button:hover {
    box-shadow: 0px 5px 8px rgba(0, 0, 0, 0.15);
  }
</style>

<button class="github-button">
  Sign up
</button>
</body>
</html>
